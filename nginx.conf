server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API caps evidence uploads at 15 MB; leave headroom for multipart overhead.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Docker's embedded DNS + a variable target lets nginx start (and survive API restarts) without the API being up.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:4000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed filenames, so they can be cached forever.
    # (`expires` rather than `add_header` here: a location-level add_header would drop the security headers above.)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # React Router: any other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
